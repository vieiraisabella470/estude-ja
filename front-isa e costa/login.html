<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Estuda Já</title>

    <link rel="stylesheet" href="sty.css">
</head>

<body class="pagina-auth">

    <div class="caixa-auth">

        <div class="logo-auth">
            <span>📚</span>
            <span>Estuda <span class="destaque">Já</span></span>
        </div>

        <h1 class="auth-titulo">Bem-vindo de volta!</h1>
        <p class="auth-subtitulo">Faça login para continuar aprendendo</p>

        <form id="formLogin" novalidate>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
                <p class="mensagem-erro" id="erroEmail"></p>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
                <p class="mensagem-erro" id="erroSenha"></p>
            </div>

            <div class="linha-opcoes">
                <a href="esqueci-senha.html">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="botao verde botao-auth" id="botaoEntrar">Entrar</button>

            <div class="status-auth" id="statusLogin"></div>

        </form>

        <p class="rodape-auth">Não tem uma conta? <a href="cadastro.html">Inscreva-se</a></p>

    </div>

    <script>
        const formulario = document.getElementById('formLogin');
        const campoEmail = document.getElementById('email');
        const campoSenha = document.getElementById('senha');
        const erroEmail = document.getElementById('erroEmail');
        const erroSenha = document.getElementById('erroSenha');
        const status = document.getElementById('statusLogin');
        const botaoEntrar = document.getElementById('botaoEntrar');

        function emailValido(valor) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(valor);
        }

        formulario.addEventListener('submit', function (e) {
            e.preventDefault();

            erroEmail.textContent = '';
            erroSenha.textContent = '';
            status.className = 'status-auth';
            status.textContent = '';

            let valido = true;
            const emailValor = campoEmail.value.trim();
            const senhaValor = campoSenha.value;

            if (!emailValor) {
                erroEmail.textContent = 'Informe seu e-mail.';
                valido = false;
            } else if (!emailValido(emailValor)) {
                erroEmail.textContent = 'Informe um e-mail válido.';
                valido = false;
            }

            if (!senhaValor) {
                erroSenha.textContent = 'Informe sua senha.';
                valido = false;
            } else if (senhaValor.length < 6) {
                erroSenha.textContent = 'A senha deve ter ao menos 6 caracteres.';
                valido = false;
            }

            if (!valido) return;

            botaoEntrar.disabled = true;
            botaoEntrar.textContent = 'Entrando...';

            // Aqui é só a validação do front-end. Quando o back-end
            // estiver pronto, troque este trecho pela chamada real de login.
            setTimeout(function () {
                status.className = 'status-auth mostrar sucesso';
                status.textContent = 'Login validado! Redirecionando para o site...';
                botaoEntrar.textContent = 'Redirecionando...';

                                setTimeout(function () {
                    window.location.href = 'materias.html';
                }, 1200);
            }, 700);
        });
    </script>

</body>

</html>
