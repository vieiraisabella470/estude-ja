<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso confirmado — Estuda Já</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#5720b7;color:#2b2540;font:16px/1.6 Arial,sans-serif}
    main{width:100%;max-width:510px;border-radius:20px;background:white;padding:36px;box-shadow:0 20px 60px #28124350}h1{color:#392075;line-height:1.2}p{overflow-wrap:anywhere}
    a{display:inline-block;margin:12px 8px 0 0;padding:10px 16px;border-radius:9px;background:#5720b7;color:white;text-decoration:none}.botao-login{background:#237b68}a:focus-visible{outline:3px solid #e8b23d;outline-offset:3px}[hidden]{display:none!important}
  </style>
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <p id="auth-loading" role="status">Confirmando sua sessão…</p>
    <section id="auth-confirmation" hidden>
      <h1>Login realizado com sucesso!</h1>
      <p>Bem-vindo(a), <strong id="account-name"></strong>.</p>
      <p>Você está conectado(a) com <span id="account-email"></span>.</p>
      <a href="video-aulas.html">Continuar para o site</a>
      <a href="login.html" class="botao-login">Sair</a>
    </section>
    <noscript>Ative o JavaScript para confirmar seu acesso.</noscript>
  </main>
</body>
</html>
